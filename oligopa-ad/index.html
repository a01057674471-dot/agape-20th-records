<!doctype html>
<html><head><meta charset="utf-8"><title>올리고파</title>
<style>
@font-face { font-family: NotoKR; font-weight: 500; src: url(fonts/NotoSansKR-500.woff2) format('woff2'); }
@font-face { font-family: NotoKR; font-weight: 800; src: url(fonts/NotoSansKR-800.woff2) format('woff2'); }
@font-face { font-family: InterTight; font-weight: 600; src: url(fonts/InterTight-600.woff2) format('woff2'); }
@font-face { font-family: JBMono; font-weight: 500; src: url(fonts/JetBrainsMono-500.woff2) format('woff2'); }
html, body { margin: 0; background: #000; overflow: hidden; }
canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import * as F from './film.js';
await Promise.all(['500 40px NotoKR', '800 40px NotoKR', '600 40px InterTight', '500 40px JBMono'].map(f => document.fonts.load(f, '가나다 0123 ABC')));
await F.load();
const g = document.getElementById('c').getContext('2d');
for (let t = 0; t < F.DUR; t += .5) F.render(g, t);      // registers every text once
window.DUR = F.DUR;
window.render = t => F.render(g, t);
window.EV = F.events();
window.TEXTS = t => F.texts(t).map(x => ({ id: x.id, text: x.text, x0: x.box[0], y0: x.box[1], x1: x.box[0] + x.box[2], y1: x.box[1] + x.box[3] }));
window.READY = true;
</script>
</body></html>
