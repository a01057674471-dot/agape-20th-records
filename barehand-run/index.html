<!doctype html>
<html><head><meta charset="utf-8"><title>맨손 겨울 러닝</title>
<style>
@font-face { font-family: "Inter Tight"; font-weight: 800; src: url(fonts/InterTight-800.woff2) format('woff2'); }
@font-face { font-family: "Inter Tight"; font-weight: 900; src: url(fonts/InterTight-900.woff2) format('woff2'); }
@font-face { font-family: "DM Mono"; font-weight: 500; src: url(fonts/DMMono-500.woff2) format('woff2'); }
@font-face { font-family: NotoKR; font-weight: 500; src: url(fonts/NotoSansKR-500.woff2) format('woff2'); }
@font-face { font-family: NotoKR; font-weight: 600; src: url(fonts/NotoSansKR-600.woff2) format('woff2'); }
@font-face { font-family: NotoKR; font-weight: 700; src: url(fonts/NotoSansKR-700.woff2) format('woff2'); }
@font-face { font-family: NotoKR; font-weight: 800; src: url(fonts/NotoSansKR-800.woff2) format('woff2'); }
@font-face { font-family: NotoKR; font-weight: 900; src: url(fonts/NotoSansKR-900.woff2) format('woff2'); }
html, body { margin: 0; background: #000; overflow: hidden; }
canvas { display: block; }
</style></head>
<body><canvas id="c" width="1080" height="1920"></canvas>
<script src="engine.js"></script>
<script type="module">
import * as F from './film.js';
await Promise.all(['800 40px "Inter Tight"', '900 40px "Inter Tight"', '500 40px "DM Mono"', ...[500, 600, 700, 800, 900].map(w => `${w} 40px NotoKR`)]
  .map(f => document.fonts.load(f, '가나다 0123 ABC°−')));
const g = document.getElementById('c').getContext('2d');
for (let t = 0; t < F.DUR; t += .125) F.render(g, t);      // registers every text once
window.DUR = F.DUR;
window.render = t => F.render(g, t);
window.EV = F.events();
window.TEXTS = t => F.texts(t).map(x => ({ id: x.id, text: x.text, x0: x.box[0], y0: x.box[1], x1: x.box[0] + x.box[2], y1: x.box[1] + x.box[3] }));
window.READY = true;
</script>
</body></html>
