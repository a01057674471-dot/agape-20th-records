<!doctype html>
<html><head><meta charset="utf-8"><title>면역과 AHCC, 확인된 사실만</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>html,body{margin:0;background:#F6F3EC;overflow:hidden}canvas{display:block}</style>
</head><body><canvas id="c" width="1920" height="1080"></canvas>
<script type="module">
import * as F from './film.js';
await Promise.all(["700 40px Gaegu", "600 40px 'Noto Serif KR'", "700 40px 'Noto Serif KR'", "400 20px 'IBM Plex Mono'"].map(f => document.fonts.load(f, '가나다 0123 ABC')));
const g = document.getElementById('c').getContext('2d');
for (let t = 0; t < F.DUR; t += .125) F.render(g, t, true);   // registers every text and sound, records the pencil's track
window.DUR = F.DUR;
window.render = t => F.render(g, t);
window.EV = F.events();
window.TEXTS = t => F.texts(t).map(x => ({ id: x.id, text: x.text, x0: x.box[0], y0: x.box[1], x1: x.box[0] + x.box[2], y1: x.box[1] + x.box[3] }));
window.READY = true;
</script>
</body></html>
