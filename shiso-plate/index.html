<!doctype html>
<html><head><meta charset="utf-8"><title>깻잎인 줄 알았던 그 잎</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>html, body { margin: 0; background: #000; overflow: hidden; } canvas { display: block; }</style>
</head><body><canvas id="c" width="1080" height="1920"></canvas>
<script type="module">
import * as F from './film.js';
await Promise.all(['500 40px "Bodoni Moda"', '600 40px "Bodoni Moda"', 'italic 500 40px "Bodoni Moda"', 'italic 600 40px "Bodoni Moda"', '600 40px "Noto Serif KR"', '700 40px "Noto Serif KR"']
  .map(f => document.fonts.load(f, 'ABC abc 깻잎 자소 α')));
await F.load();
const g = document.getElementById('c').getContext('2d');
for (let t = 0; t < F.DUR; t += .25) F.render(g, t);      // registers every text once
window.DUR = F.DUR;
window.render = t => F.render(g, t);
window.EV = F.events();
window.TEXTS = t => F.texts(t).map(x => ({ id: x.id, text: x.text, x0: x.box[0], y0: x.box[1], x1: x.box[0] + x.box[2], y1: x.box[1] + x.box[3] }));
window.READY = true;
</script>
</body></html>
